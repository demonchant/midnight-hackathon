services:
  cpg-public:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: cpg-public-web:0.1.0
    restart: unless-stopped
    environment:
      PORT: "8080"
      CPG_PUBLIC_HOST: "0.0.0.0"
      CPG_TRUST_PROXY: "1"
      CPG_COMPILER_VERSION: "0.31.1"
      CPG_COMPILER_IMAGE: "cpg-compact-compiler:0.31.1"
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.50
    networks:
      - app-isolated
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  app-isolated:
    internal: true
